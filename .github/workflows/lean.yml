name: Lean verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Lean, Mathlib cache, and build
        uses: leanprover/lean-action@v1
        with:
          auto-config: 'false'
          build: 'true'
          test: 'false'
          use-mathlib-cache: 'true'
      - name: Recheck pinned source and formalized claims
        run: bash scripts/verify.sh
      - name: Save verification log artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f3-lean-verification-logs
          path: verification_runs/
          if-no-files-found: ignore
          retention-days: 14
